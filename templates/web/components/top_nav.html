{% load i18n %}
<div class="sticky top-0 z-50 bg-base-100/80 backdrop-blur-lg border-b border-base-300"
     x-data="{ mobileMenuOpen: false }">
  <div class="navbar px-4">

    <!-- Left: back button (shown when back_url block is set) + mobile menu toggle -->
    <div class="navbar-start gap-2">
      <div class="lg:hidden">
        <button @click="mobileMenuOpen = true" class="btn btn-ghost btn-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="24" height="24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
          </svg>
        </button>
      </div>
      {% block back_button %}{% endblock %}
    </div>

    <!-- Center: site name -->
    <div class="navbar-center">
      <a href="{% url 'web:home' %}" class="text-lg font-semibold tracking-tight hover:opacity-80 transition-opacity">
        {{ project_meta.NAME }}
      </a>
    </div>

    <!-- Right: Dashboard link + auth links -->
    <div class="navbar-end gap-2">
      {% if user.is_authenticated %}
        <a href="{% url 'web:home' %}" class="btn btn-primary btn-sm">
          {% translate "Dashboard" %}
        </a>
        <a href="{% url 'account_logout' %}" class="btn btn-ghost btn-sm">
          {% translate "Sign Out" %}
        </a>
      {% else %}
        <a href="{% url 'account_signup' %}" class="btn btn-primary btn-sm">
          {% translate "Sign Up" %}
        </a>
        <a href="{% url 'account_login' %}" class="btn btn-outline btn-sm">
          {% translate "Sign In" %}
        </a>
      {% endif %}
    </div>

  </div>

  <!-- Mobile drawer -->
  <template x-teleport="body">
    <div x-show="mobileMenuOpen" x-cloak class="fixed inset-0 z-50 lg:hidden">
      <div x-show="mobileMenuOpen"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0"
           x-transition:enter-end="opacity-100"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0"
           @click="mobileMenuOpen = false"
           class="fixed inset-0 bg-black/30 backdrop-blur-sm"></div>
      <div x-show="mobileMenuOpen"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="-translate-x-full"
           x-transition:enter-end="translate-x-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="translate-x-0"
           x-transition:leave-end="-translate-x-full"
           class="fixed inset-y-0 left-0 w-64 bg-base-100 shadow-xl overflow-y-auto">
        <div class="flex items-center justify-between p-4 border-b border-base-200">
          <span class="font-semibold text-lg">{{ project_meta.NAME }}</span>
          <button @click="mobileMenuOpen = false" class="btn btn-ghost btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <ul class="menu p-4">
          {% block mobile_nav %}
          <li>
            <a href="{% url 'web:home' %}" class="{% if request.path == '/' %}active{% endif %}">
              {% translate "Dashboard" %}
            </a>
          </li>
          {% if user.is_authenticated %}
          <li>
            <a href="{% url 'pets:pet_list' %}">{% translate "Browse Pets" %}</a>
          </li>
          <li>
            <a href="{% url 'adoptions:my_requests' %}">{% translate "My Requests" %}</a>
          </li>
          <li>
            <a href="{% url 'users:user_profile' %}">{% translate "Profile" %}</a>
          </li>
          <li>
            <a href="{% url 'account_logout' %}">{% translate "Sign Out" %}</a>
          </li>
          {% endif %}
          {% endblock %}
        </ul>
      </div>
    </div>
  </template>
</div>
